plugins {
	id 'com.android.application'
}

// Release signing. keystore.properties and the keystore it points at are both
// kept out of git, so a contributor without them still gets a working debug
// build and an unsigned release build rather than a failure.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def canSignRelease = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (canSignRelease) {
	keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
	compileSdk 36
	
	defaultConfig {
		applicationId "com.zzok.medbook"
		namespace "com.zzok.medbook"
		minSdkVersion 21
		targetSdkVersion 36
		versionCode 55
		versionName "0.1.0-alpha.3"
	}
	
	signingConfigs {
		if (canSignRelease) {
			release {
				storeFile file(keystoreProperties['storeFile'])
				storePassword keystoreProperties['storePassword']
				keyAlias keystoreProperties['keyAlias']
				keyPassword keystoreProperties['keyPassword']
			}
		}
	}
	
	buildTypes {
		release {
			if (canSignRelease) {
				signingConfig signingConfigs.release
			}
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	buildFeatures {
		viewBinding true
	}
}

dependencies {
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'com.google.android.material:material:1.12.0'
	implementation 'androidx.core:core-splashscreen:1.0.1'
}
