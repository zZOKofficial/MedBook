plugins {
	id 'com.android.application'
}

// Release signing. keystore.properties and the keystore it points at are both
// kept out of git, so a contributor without them still gets a working debug
// build and an unsigned release build rather than a failure.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def canSignRelease = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (canSignRelease) {
	keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// The doctor directory. Its source data covers 7,438 named doctors, so neither the
// dataset nor the artifacts built from it are in this repo; dataset.properties points
// at a private archive elsewhere on the machine. Same bargain as signing above -- a
// contributor without it gets a working build whose directory is simply empty, rather
// than a failure.
def datasetPropertiesFile = rootProject.file("dataset.properties")
def datasetProperties = new Properties()
if (datasetPropertiesFile.exists()) {
	datasetPropertiesFile.withInputStream { datasetProperties.load(it) }
}
def datasetDir = datasetProperties['dataset.dir']
def datasetKey = datasetProperties['dataset.key'] ?: ""
def hasDataset = datasetDir != null && file(datasetDir).exists()
if (datasetDir != null && !hasDataset) {
	logger.warn("dataset.dir '${datasetDir}' does not exist - building without the doctor directory")
}

android {
	compileSdk 36
	
	defaultConfig {
		applicationId "com.oxyorb.medbook"
		namespace "com.oxyorb.medbook"
		minSdkVersion 21
		targetSdkVersion 36
		versionCode 57
		versionName "0.3.0-alpha.1"
		buildConfigField "String", "DATASET_KEY", "\"${datasetKey}\""
	}

	sourceSets {
		main {
			if (hasDataset) {
				assets.srcDirs += datasetDir
			}
		}
	}

	androidResources {
		// Both are already compressed; re-deflating them only costs build time, and
		// leaving them stored lets AssetManager map the portraits straight out of the APK.
		noCompress += ["webp", "dat"]
		// MedBook ships English and Bengali. appcompat and material carry about
		// seventy other language folders between them; none of them are ours, and
		// keeping them would put translations in the picker that do not exist.
		localeFilters += ["en", "bn"]
	}

	signingConfigs {
		if (canSignRelease) {
			release {
				storeFile file(keystoreProperties['storeFile'])
				storePassword keystoreProperties['storePassword']
				keyAlias keystoreProperties['keyAlias']
				keyPassword keystoreProperties['keyPassword']
			}
		}
	}
	
	buildTypes {
		release {
			if (canSignRelease) {
				signingConfig signingConfigs.release
			}
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	buildFeatures {
		viewBinding true
		buildConfig true
	}
}

dependencies {
	// Test only; nothing here reaches the APK. Department search and, later, the
	// semver comparison are pure functions whose edge cases cannot be reached by
	// tapping -- a Bengali query in particular needs an IME the emulator cannot be
	// driven through from adb.
	testImplementation 'junit:junit:4.13.2'

	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'com.google.android.material:material:1.12.0'
	implementation 'androidx.core:core-splashscreen:1.0.1'
	implementation 'androidx.recyclerview:recyclerview:1.4.0'
}
